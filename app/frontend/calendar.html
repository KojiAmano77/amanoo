<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支部活動予定カレンダー</title>
    <link rel="stylesheet" href="/static/css/calendar.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="header">
        <a href="/dashboard" class="back-link"><i class="fas fa-arrow-left"></i> ダッシュボードへ戻る</a>
        <h1>支部活動予定</h1>
        <button id="logout-button" class="logout-btn">ログアウト</button>
    </div>

    <div id="calendar-container">
        <div id="calendar"></div>
    </div>

    <!-- Event Modal -->
    <div id="event-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-title">予定を追加</h2>
            <form id="event-form">
                <input type="hidden" id="event-id">
                <div class="form-group">
                    <label for="event-title">タイトル</label>
                    <input type="text" id="event-title" required>
                </div>
                <div class="datetime-group">
                    <div class="form-group">
                        <label for="event-start">開始日時</label>
                        <input type="datetime-local" id="event-start" required>
                    </div>
                    <div class="form-group">
                        <label for="event-end">終了日時</label>
                        <input type="datetime-local" id="event-end">
                    </div>
                </div>
                <div class="form-group">
                    <label for="event-description">詳細 (任意)</label>
                    <textarea id="event-description" rows="18"></textarea>
                </div>
                <div class="form-group" id="url-input-group">
                    <label for="event-adjust-url">URL (任意)</label>
                    <input type="url" id="event-adjust-url" placeholder="https://chouseisan.com/...">
                </div>
                <div id="event-adjust-url-display" class="hidden" style="margin-bottom: 15px; word-wrap: break-word;">
                    <a href="#" target="_blank" rel="noopener noreferrer"></a>
                </div>
                <div class="modal-buttons">
                    <button type="submit" id="save-event-button">保存</button>
                    <button type="button" id="delete-event-button" class="delete-btn hidden">削除</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales-all.min.js"></script>
    <script src="/static/js/calendar.js"></script>
</body>
</html>
