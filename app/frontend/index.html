<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛知第12支部活動記録マップ</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <div class="container">
        <h1>愛知第12支部活動記録マップ</h1>
        
        <div id="auth-section">
            <div class="auth-forms">
                <div class="form-section">
                    <h2>ログイン</h2>
                    <form id="login-form">
                        <input type="text" id="login-username" placeholder="ユーザー名" required>
                        <input type="password" id="login-password" placeholder="パスワード" required>
                        <button type="submit">ログイン</button>
                    </form>
                    <p><a href="#" id="forgot-password-link">パスワードをお忘れですか？</a></p>
                </div>
                
                <!-- 新規登録UI：セキュリティのため一時的に非表示（バックエンドのロジックは残存）
                     再表示する場合は display:none を削除する -->
                <div class="form-section" style="display:none;">
                    <h2>新規登録</h2>
                    <form id="register-form">
                        <input type="text" id="register-username" placeholder="ユーザー名" required>
                        <input type="email" id="register-email" placeholder="メールアドレス" required>
                        <input type="password" id="register-password" placeholder="パスワード" required>
                        <button type="submit">新規登録</button>
                    </form>
                </div>
                
                <div class="form-section" id="reset-form-section" style="display: none;">
                    <h2>パスワードリセット</h2>
                    <form id="reset-request-form">
                        <input type="email" id="reset-email" placeholder="メールアドレス" required>
                        <button type="submit">リセット用メールを送信</button>
                    </form>
                    <p><a href="#" id="back-to-login-link">ログインに戻る</a></p>
                </div>
            </div>
        </div>
        
        <div id="message-area"></div>
    </div>

    <script src="/static/js/index.js"></script>
</body>
</html>
