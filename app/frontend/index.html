<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛知第12支部活動記録マップ</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/index.css?v=2">
</head>
<body>
    <div class="container">
        <h1>愛知第12支部活動記録マップ</h1>
        
        <div id="auth-section">
            <div class="auth-forms">
                <div class="form-section">
                    <h2>ログイン</h2>
                    <form id="login-form">
                        <input type="text" id="login-username" placeholder="ユーザー名" required>
                        <input type="password" id="login-password" placeholder="パスワード" required>
                        <button type="submit">ログイン</button>
                    </form>
                    <p><a href="#" id="forgot-password-link">パスワードをお忘れですか？</a></p>
                </div>
                
                <!-- アカウント申請：支部長の承認後にログイン情報がメールで届く（即時発行はしない） -->
                <div class="form-section" id="account-request-section">
                    <h2>アカウント申請</h2>
                    <p class="form-note">アカウントをお持ちでない方は、お名前とメールアドレスを入力して申請してください。支部長の承認後、ログインIDとパスワードをメールでお送りします。</p>
                    <form id="account-request-form">
                        <input type="text" id="request-username" placeholder="お名前（フルネーム）" maxlength="50" required>
                        <input type="email" id="request-email" placeholder="メールアドレス" maxlength="100" required>
                        <button type="submit">申請する</button>
                    </form>
                </div>

                <div class="form-section" id="reset-form-section" style="display: none;">
                    <h2>パスワードリセット</h2>
                    <form id="reset-request-form">
                        <input type="email" id="reset-email" placeholder="メールアドレス" required>
                        <button type="submit">リセット用メールを送信</button>
                    </form>
                    <p><a href="#" id="back-to-login-link">ログインに戻る</a></p>
                </div>
            </div>
        </div>
        
        <div id="message-area"></div>
    </div>

    <script src="/static/js/index.js?v=2"></script>
</body>
</html>
