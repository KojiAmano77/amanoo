<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードリセット - 愛知12支部活動記録マップ</title>
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <div class="container">
        <h1>パスワードリセット</h1>
        
        <div id="reset-section">
            <div class="form-section">
                <h2>新しいパスワードを設定</h2>
                <form id="password-reset-form">
                    <input type="hidden" id="reset-token" value="{{ token }}">
                    <input type="password" id="new-password" placeholder="新しいパスワード" required>
                    <input type="password" id="confirm-password" placeholder="パスワード確認" required>
                    <button type="submit">パスワードを変更</button>
                </form>
                <p><a href="/login">ログインページに戻る</a></p>
            </div>
        </div>
        
        <div id="message-area"></div>
    </div>

    <script src="/static/js/reset-password.js"></script>
</body>
</html>
