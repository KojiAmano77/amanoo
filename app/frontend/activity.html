<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動記録</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-5e2ESR8Ycmos6g3gAKr1Jvwye8sW4U1u/cAKulfVJnkakCcMqhOudbtPnvJ+nbv7" crossorigin="anonymous" />
    <link rel="stylesheet" href="/static/css/activity.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>愛知第12支部活動記録マップ</h1>
            <a href="/calendar" id="calendar-link" title="カレンダー">
                <i class="fas fa-calendar-alt"></i>
            </a>
            <div class="user-info">
                <span class="user-avatar">👤</span>
                <span id="current-user-badge" class="user-name">…</span>
            </div>
            <button class="logout-btn" onclick="logout()">ログアウト</button>
        </div>

        <!-- 絞り込みパネル -->
        <div class="filter-panel">
            <div class="filter-panel-header">
                <span class="filter-panel-title">🔍 絞り込み</span>
                <button id="reset-filter-btn" class="reset-filter-btn" onclick="resetDateFilter()">✕ リセット</button>
            </div>
            <div class="filter-controls">

                <!-- 日付 -->
                <div class="filter-group filter-group-date">
                    <span class="filter-label">📅 日付</span>
                    <div class="filter-date-row">
                        <input type="date" id="start-date" class="filter-date-input">
                        <span class="date-sep">〜</span>
                        <input type="date" id="end-date" class="filter-date-input">
                        <button id="filter-btn" class="filter-btn" onclick="applyDateFilter()">期間指定</button>
                    </div>
                </div>

                <div class="filter-divider"></div>

                <!-- 担当者 -->
                <div class="filter-group">
                    <span class="filter-label">👤 担当者</span>
                    <select id="map-filter-user" class="map-filter-select" onchange="applyMapFilters()">
                        <option value="">すべて</option>
                    </select>
                </div>

                <!-- 活動種別 -->
                <div class="filter-group">
                    <span class="filter-label">🎯 活動種別</span>
                    <select id="map-filter-type" class="map-filter-select" onchange="applyMapFilters()">
                        <option value="">すべて</option>
                        <option value="辻立ち">辻立ち</option>
                        <option value="ポスティング">ポスティング</option>
                        <option value="あいさつ回り">あいさつ回り</option>
                        <option value="ポスター掲示">ポスター掲示</option>
                        <option value="街宣車活動">街宣車活動</option>
                        <option value="その他">その他</option>
                    </select>
                </div>

                <!-- キーワード -->
                <div class="filter-group">
                    <span class="filter-label">🔤 キーワード</span>
                    <input type="text" id="map-search" class="map-search-input"
                        placeholder="場所・メモで絞り込み…"
                        autocomplete="off"
                        readonly
                        onfocus="this.removeAttribute('readonly'); if(this.value){this.value='';applyMapFilters();}"
                        oninput="applyMapFilters()">
                </div>

            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('map-view')">地図</button>
            <button class="tab" onclick="switchTab('my-activities')">自分の記録</button>
            <button class="tab" onclick="switchTab('team-activities')">支部記録</button>
            <button id="admin-tab" class="tab hidden" onclick="switchTab('admin-users')">管理者メニュー</button>
        </div>

        <div class="tab-content">
            <div id="message-area"></div>

            <!-- 地図タブ -->
            <div id="map-view">
                <div class="map-header">
                    <h2>エリアを描画して記録作成</h2>
                    <button id="current-location-btn" class="current-location-btn" onclick="moveToCurrentLocation()">📍現在地へ</button>
                    <button class="gpx-upload-btn" onclick="document.getElementById('gpx-file-input').click()">📂 GPX読込</button>
                    <input type="file" id="gpx-file-input" accept=".gpx" style="display:none" onchange="handleGpxUpload(event)">
                    <button id="gpx-clear-btn" class="gpx-clear-btn hidden" onclick="clearGpxTrack()">✕ 軌跡消去</button>
                    <button id="pin-mode-btn" class="gpx-upload-btn" onclick="togglePinMode()">📌 地点登録</button>
                    <button id="pin-clear-btn" class="gpx-clear-btn hidden" onclick="clearPin()">✕ ピン消去</button>
                    <button id="district-toggle-btn" class="gpx-upload-btn" onclick="toggleSchoolDistricts()">㊫境界表示</button>
                    <button id="council-toggle-btn" class="gpx-upload-btn" onclick="toggleCouncilMembers()">🏛️ 市議員</button>
                </div>
                
                <form id="activity-form">
                    <div class="form-row keep-horizontal">
                        <div class="form-field">
                            <label for="activity-type">活動種別</label>
                            <select id="activity-type" required>
                                <option value="">活動種別を選択</option>
                                <option value="辻立ち">辻立ち</option>
                                <option value="ポスティング">ポスティング</option>
                                <option value="あいさつ回り">あいさつ回り</option>
                                <option value="ポスター掲示">ポスター掲示</option>
                                <option value="街宣車活動">街宣車活動</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="activity-date">日付</label>
                            <input type="date" id="activity-date" required>
                        </div>
                    </div>
                    <div class="form-row keep-horizontal">
                        <div class="form-field">
                            <label for="location">場所</label>
                            <div id="location" class="location-display">エリア描画・GPX読み込み・ピン登録のいずれかをしてください</div>
                        </div>
                        <div class="form-field">
                            <label for="memo">メモ</label>
                            <input type="text" id="memo" placeholder="メモ（任意）">
                        </div>
                    </div>
                </form>
                <div class="form-row">
                    <button type="submit" form="activity-form" class="submit-btn">記録する</button>
                </div>
                
                <div id="map"></div>
                <div id="gpx-info" class="gpx-info hidden"></div>
                
                <p style="color: #666; font-size: 14px; margin-top: 15px;">地図上でポリゴン（多角形）を描画すると、そのエリアでの活動記録を作成できます。</p>
            </div>


            <div id="my-activities" class="hidden">
                <h2>自分の活動記録</h2>
                
                <table class="activities-table">
                    <thead>
                        <tr>
                            <th>日付</th>
                            <th>活動種別</th>
                            <th>場所</th>
                            <th>メモ</th>
                            <th>距離</th>
                            <th>ルート色</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="my-activities-tbody">
                    </tbody>
                </table>

                <div class="mobile-activity-list" id="my-activities-mobile">
                </div>
            </div>

            <div id="team-activities" class="hidden">
                <div class="section-header">
                    <h2>支部全体の活動記録</h2>
                </div>
                
                <table class="activities-table">
                    <thead>
                        <tr>
                            <th>担当者</th>
                            <th>日付</th>
                            <th>活動種別</th>
                            <th>場所</th>
                            <th>メモ</th>
                            <th>距離</th>
                            <th>ルート色</th>
                            <th id="team-action-header" class="hidden">操作</th>
                        </tr>
                    </thead>
                    <tbody id="team-activities-tbody">
                    </tbody>
                </table>

                <div class="mobile-activity-list" id="team-activities-mobile">
                </div>
            </div>

            <div id="admin-users" class="hidden">
                <div class="section-header">
                    <h2>管理者メニュー</h2>
                    <button class="add-user-btn" onclick="openUserModal()">＋ 新規ユーザー登録</button>
                </div>
                <p class="admin-hint">管理者のみが閲覧・操作できるユーザー一覧です。</p>
                <table class="activities-table">
                    <thead>
                        <tr>
                            <th>ユーザー名</th>
                            <th>メールアドレス</th>
                            <th>登録日</th>
                            <th>更新日</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="admin-users-tbody">
                    </tbody>
                </table>

                <!-- モバイル用カードリスト -->
                <div class="mobile-activity-list" id="admin-users-mobile"></div>
            </div>

        </div>
    </div>

    <!-- 活動記録編集ダイアログ（管理者専用） -->
    <div id="edit-activity-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h3 class="modal-title">✏️ 活動記録を編集</h3>
            <div class="modal-form">
                <div class="modal-field">
                    <label>担当者</label>
                    <input type="text" id="edit-username" placeholder="ユーザー名">
                </div>
                <div class="modal-field">
                    <label>日付</label>
                    <input type="date" id="edit-date">
                </div>
                <div class="modal-field">
                    <label>活動種別</label>
                    <select id="edit-activity-type">
                        <option value="辻立ち">辻立ち</option>
                        <option value="ポスティング">ポスティング</option>
                        <option value="あいさつ回り">あいさつ回り</option>
                        <option value="ポスター掲示">ポスター掲示</option>
                        <option value="街宣車活動">街宣車活動</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="modal-field">
                    <label>場所</label>
                    <input type="text" id="edit-location">
                </div>
                <div class="modal-field">
                    <label>メモ</label>
                    <input type="text" id="edit-memo">
                </div>
                <div class="modal-field">
                    <label>距離 (km)</label>
                    <input type="number" id="edit-distance" step="0.01" min="0" placeholder="例: 3.50">
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-cancel-btn" onclick="closeEditModal()">キャンセル</button>
                <button class="modal-ok-btn" onclick="submitEditActivity()">OK</button>
            </div>
        </div>
    </div>

    <!-- ユーザー登録・編集ダイアログ（管理者専用） -->
    <div id="user-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h3 class="modal-title" id="user-modal-title">👤 ユーザー登録</h3>
            <div class="modal-form">
                <div class="modal-field">
                    <label>ユーザー名 <span class="required-mark">*</span></label>
                    <input type="text" id="user-modal-username" placeholder="ユーザー名">
                </div>
                <div class="modal-field">
                    <label>メールアドレス（任意）</label>
                    <input type="email" id="user-modal-email" placeholder="example@example.com">
                </div>
                <div class="modal-field">
                    <label id="user-modal-pw-label">パスワード <span class="required-mark">*</span></label>
                    <input type="password" id="user-modal-password" placeholder="パスワード">
                </div>
                <div class="modal-field">
                    <label>権限</label>
                    <div class="permission-checkboxes">
                        <label class="checkbox-label">
                            <input type="checkbox" id="user-modal-is-admin"
                                onchange="onPermissionChange('admin')"> 管理者
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="user-modal-is-readonly"
                                onchange="onPermissionChange('readonly')"> 閲覧専用
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-cancel-btn" onclick="closeUserModal()">キャンセル</button>
                <button class="modal-ok-btn" id="user-modal-ok-btn" onclick="submitUserModal()">登録</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="/static/js/activity.js?v=26"></script>
</body>
</html>
