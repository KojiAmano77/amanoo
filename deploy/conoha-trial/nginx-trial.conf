    # ===== お試し版（歩行ログ記録）: dev.sanseitoaichi12.f5.si =====

    # 【A】HTTP（証明書取得用＋HTTPSへ転送）— 先にこれだけ追加して証明書を取る
    server {
        listen 80;
        server_name dev.sanseitoaichi12.f5.si;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # 【B】HTTPS — 証明書を取得してから追加する
    server {
        listen 443 ssl http2;
        server_name dev.sanseitoaichi12.f5.si;

        ssl_certificate /etc/letsencrypt/live/dev.sanseitoaichi12.f5.si/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.sanseitoaichi12.f5.si/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 写真10枚＋ルートの報告に対応
        client_max_body_size 20M;
        # Chatworkへの画像連続投稿（1枚ごとに1秒空ける）を待てるよう長めにする
        proxy_read_timeout 180s;

        location / {
            proxy_pass http://activity_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
