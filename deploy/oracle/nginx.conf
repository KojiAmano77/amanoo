events {
    worker_connections 1024;
}

http {
    upstream activity_app {
        server activity_app:8000;
    }

    server {
        listen 80;
        server_name sanseitoaichi12.f5.si;

        # 証明書更新（certbot の webroot 方式）用
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name sanseitoaichi12.f5.si;

        ssl_certificate /etc/letsencrypt/live/sanseitoaichi12.f5.si/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sanseitoaichi12.f5.si/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 複数GPXを連結した投稿を受け取れるようにする（ConoHa 側と同じ値）
        client_max_body_size 20M;

        location / {
            proxy_pass http://activity_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
