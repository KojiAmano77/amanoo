services:
  mysql:
    image: mysql:8.0
    container_name: team_activity_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: team_activities
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - activity_network

  fastapi:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: activity_app
    volumes:
      - ./app:/app
      - ./.env:/app/.env
    depends_on:
      - mysql
    networks:
      - activity_network
    expose:
      - "8000"

volumes:
  mysql_data:

networks:
  activity_network:
    driver: bridge
